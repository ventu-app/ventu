<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ventu App 1.0.1</title>
    <style>
        :root {
            --bg: #0b0f19;
            --panel: #151b2b;
            --text: #e2e8f0;
            --text-muted: #94a3b8;
            --gold: #fbbf24;
            --gold-hover: #f59e0b;
            --error: #ef4444;
            --border: #1e293b;
            --npc-bubble: #1e293b;
            --player-bubble: #3b82f6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        header {
            background-color: var(--panel);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            z-index: 10;
        }

        #mission-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--gold);
        }

        .stats {
            display: flex;
            gap: 20px;
        }

        .stat {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-value {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--gold);
        }

        /* Layout Principal */
        main {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Sidebar (Glossário) */
        aside {
            width: 300px;
            background-color: var(--panel);
            border-right: 1px solid var(--border);
            padding: 20px;
            overflow-y: auto;
            display: none; /* Esconde no mobile */
        }

        @media (min-width: 768px) {
            aside {
                display: block;
            }
        }

        aside h3 {
            font-size: 1rem;
            color: var(--gold);
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }

        #glossary-list {
            list-style: none;
        }

        #glossary-list li {
            margin-bottom: 10px;
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.4;
        }

        #glossary-list strong {
            color: var(--text);
        }

        /* Chat Area */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        #chat-history {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            scroll-behavior: smooth;
        }

        .chat-message {
            display: flex;
            gap: 12px;
            max-width: 85%;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .chat-message.player {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .npc-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: var(--border);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        .player-avatar {
            background-color: var(--player-bubble);
            font-size: 0.8rem;
            font-weight: bold;
        }

        .msg-content {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .msg-sender {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .player .msg-sender {
            text-align: right;
        }

        .msg-bubble {
            background-color: var(--npc-bubble);
            padding: 12px 16px;
            border-radius: 0 12px 12px 12px;
            font-size: 0.95rem;
            line-height: 1.5;
            color: var(--text);
            white-space: pre-wrap;
        }

        .player .msg-bubble {
            background-color: var(--player-bubble);
            border-radius: 12px 0 12px 12px;
        }

        /* Typing Indicator */
        .typing-bubble {
            display: flex;
            gap: 5px;
            align-items: center;
            padding: 15px 20px;
        }

        .dot {
            width: 6px;
            height: 6px;
            background-color: var(--text-muted);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* Quick Replies e Input */
        .input-area {
            padding: 15px 20px;
            background-color: var(--bg);
            border-top: 1px solid var(--border);
        }

        #quick-replies {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 12px;
            scrollbar-width: none;
        }
        
        #quick-replies::-webkit-scrollbar { display: none; }

        .quick-reply-btn {
            background-color: transparent;
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .quick-reply-btn:hover:not(:disabled) {
            background-color: var(--gold);
            color: var(--bg);
        }

        .quick-reply-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #chat-form {
            display: flex;
            gap: 10px;
        }

        #chat-input {
            flex: 1;
            background-color: var(--panel);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 15px;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        #chat-input:focus {
            border-color: var(--gold);
        }

        #chat-form button {
            background-color: var(--gold);
            color: var(--bg);
            border: none;
            padding: 0 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        #chat-form button:hover:not(:disabled) {
            background-color: var(--gold-hover);
        }

        #chat-form button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Char Select Overlay */
        #char-select-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(11, 15, 25, 0.95);
            backdrop-filter: blur(10px);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        #char-select-overlay[hidden] {
            display: none;
        }

        .char-select-header {
            text-align: center;
            margin-bottom: 40px;
        }

        #char-select-title {
            font-size: 2rem;
            color: var(--gold);
            margin-bottom: 10px;
        }

        #char-select-hint {
            color: var(--text-muted);
            font-size: 1rem;
        }

        #char-cards {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 1000px;
        }

        .char-card {
            background-color: var(--panel);
            border: 2px solid var(--border);
            border-radius: 16px;
            padding: 25px;
            width: 280px;
            text-align: left;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            position: relative;
            color: var(--text);
            animation: fadeInUp 0.5s ease backwards;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .char-card:hover:not(.char-card-locked) {
            border-color: var(--gold);
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        .char-card-locked {
            opacity: 0.5;
            cursor: not-allowed;
            filter: grayscale(1);
        }

        .char-card-emoji {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        .char-card-role {
            font-size: 0.8rem;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
            margin-bottom: 5px;
            display: block;
        }

        .char-card-name {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        .char-card-desc {
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.5;
            flex: 1;
        }

        .char-card-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 0.7rem;
            padding: 4px 8px;
            border-radius: 12px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .badge-start, .badge-new { background-color: var(--gold); color: var(--bg); }
        .badge-active { background-color: var(--player-bubble); color: white; }
        .badge-done { background-color: #10b981; color: white; }
        .badge-locked { background-color: var(--border); color: var(--text-muted); }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
    </style>
</head>
<body>

    <header>
        <div id="mission-title">Burger Palace</div>
        <div class="stats">
            <div class="stat">
                <span class="stat-label">Dinheiro</span>
                <span class="stat-value" id="stat-money">$ 0.00</span>
            </div>
            <div class="stat">
                <span class="stat-label">Energia</span>
                <span class="stat-value" id="stat-energy">100/100</span>
            </div>
        </div>
    </header>

    <main>
        <aside>
            <h3>Glossário</h3>
            <ul id="glossary-list">
                <!-- Glossário dinâmico aqui -->
            </ul>
        </aside>

        <div class="chat-container">
            <div id="chat-history">
                <!-- Histórico do chat -->
            </div>
            
            <div class="input-area">
                <div id="quick-replies">
                    <!-- Botões de resposta rápida -->
                </div>
                <form id="chat-form">
                    <input type="text" id="chat-input" placeholder="Digite sua resposta..." autocomplete="off" required>
                    <button type="submit">Enviar</button>
                </form>
            </div>
        </div>
    </main>

    <!-- Tela de Seleção de Personagem -->
    <div id="char-select-overlay" hidden>
        <div class="char-select-header">
            <h1 id="char-select-title">Escolha sua perspectiva</h1>
            <p id="char-select-hint">A mesma noite. Três ângulos.</p>
        </div>
        <div id="char-cards">
            <!-- Cards gerados via JS -->
        </div>
    </div>

    <!-- Scripts -->
    <script src="src/data/a1_burger.js"></script>
    <script>
        // Vincula os dados do arquivo a1_burger.js à engine do game.js
        if (typeof gameDataA1 !== 'undefined') {
            window.currentGameData = gameDataA1;
        } else {
            console.error("Erro: gameDataA1 não foi carregado. Verifique o caminho src/data/a1_burger.js");
        }
    </script>
    <script src="src/engine/game.js"></script>
</body>
</html>
