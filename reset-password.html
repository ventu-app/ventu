<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redefinir Senha — Ventu</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { --bg: #0b0f19; --panel: #151b2b; --text: #e2e8f0; --text-muted: #94a3b8; --gold: #fbbf24; --border: #1e293b; --error: #ef4444; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .box { background: var(--panel); padding: 30px; border-radius: 12px; width: 100%; max-width: 400px; border: 1px solid var(--border); text-align: center; }
    h2 { color: var(--gold); margin-bottom: 20px; font-family: 'Playfair Display', serif; }
    input { width: 100%; padding: 12px; margin-bottom: 15px; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 8px; outline: none; }
    input:focus { border-color: var(--gold); }
    button { width: 100%; padding: 12px; background: var(--gold); color: var(--bg); font-weight: bold; border: none; border-radius: 8px; cursor: pointer; transition: 0.2s; }
    button:hover { background: #f59e0b; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .msg { margin-top: 15px; font-size: 0.9rem; font-weight: bold; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="box">
    <h2>Redefinir Senha</h2>
    <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 20px;">Digite sua nova senha abaixo para recuperar o acesso.</p>
    
    <form id="reset-form">
      <input type="password" id="new-password" placeholder="Nova senha (mín. 6 caracteres)" required minlength="6">
      <input type="password" id="confirm-password" placeholder="Confirme a nova senha" required minlength="6">
      <button type="submit" id="btn-reset">Salvar Nova Senha</button>
    </form>
    
    <div id="msg" class="msg hidden"></div>
  </div>

  <script>
    const supabase = window.supabase.createClient(
      'https://hbqjoadubrwuafbfykre.supabase.co', 
      'sb_publishable_Wg3q6v4-ZbVK_9WQXnuFpQ_CZXH68L_'
    );

    const form = document.getElementById('reset-form');
    const msg = document.getElementById('msg');
    const btn = document.getElementById('btn-reset');

    // Função para extrair o token da URL
    async function checkSession() {
      // O Supabase coloca o token no hash da URL (ex: #access_token=...&type=recovery)
      const hash = window.location.hash.substring(1);
      if (hash) {
        const params = new URLSearchParams(hash);
        const accessToken = params.get('access_token');
        const refreshToken = params.get('refresh_token');
        
        if (accessToken && refreshToken) {
          const { error } = await supabase.auth.setSession({
            access_token: accessToken,
            refresh_token: refreshToken
          });
          if (error) {
            msg.innerText = "Link expirado ou inválido. Solicite um novo.";
            msg.style.color = "var(--error)";
            msg.classList.remove('hidden');
            form.classList.add('hidden');
          }
        }
      }
    }

    checkSession();

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const pass = document.getElementById('new-password').value;
      const confirm = document.getElementById('confirm-password').value;

      if (pass !== confirm) {
        msg.innerText = "As senhas não coincidem.";
        msg.style.color = "var(--error)";
        msg.classList.remove('hidden');
        return;
      }

      btn.disabled = true;
      btn.innerText = "Salvando...";

      const { error } = await supabase.auth.updateUser({ password: pass });

      if (error) {
        msg.innerText = "Erro: " + error.message;
        msg.style.color = "var(--error)";
        msg.classList.remove('hidden');
        btn.disabled = false;
        btn.innerText = "Salvar Nova Senha";
      } else {
        msg.innerText = "Senha alterada com sucesso! Redirecionando...";
        msg.style.color = "#10b981"; // success
        msg.classList.remove('hidden');
        setTimeout(() => {
          window.location.href = 'auth.html';
        }, 2000);
      }
    });
  </script>
</body>
</html>
