<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo — Ventu</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="src/styles/global.css">
  <link rel="stylesheet" href="src/styles/home.css">
  <link rel="stylesheet" href="src/styles/game.css">
  
  <script>
    const savedTheme = localStorage.getItem('ventu-theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
  </script>
</head>
<body class="game-body">

  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">
        <svg width="30" height="30" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <path d="M 14 52 L 22 8 L 42 40 Z" fill="#fbbf24"/><path d="M 86 52 L 78 8 L 58 40 Z" fill="#fbbf24"/><path d="M 22 46 L 25 22 L 36 38 Z" fill="#ea580c"/><path d="M 78 46 L 75 22 L 64 38 Z" fill="#ea580c"/><path d="M 10 48 Q 10 78, 50 96 Q 90 78, 90 48 Q 90 38, 80 38 L 20 38 Q 10 38, 10 48 Z" fill="#fbbf24"/><path d="M 50 92 Q 35 84, 32 72 Q 40 76, 50 76 Q 60 76, 68 72 Q 65 84, 50 92 Z" fill="#fef3c7"/><ellipse cx="35" cy="58" rx="3.5" ry="5" fill="#0b0f19"/><ellipse cx="65" cy="58" rx="3.5" ry="5" fill="#0b0f19"/><path d="M 46 72 L 54 72 L 50 78 Z" fill="#0b0f19"/>
        </svg>
        <span class="logo-text">VENTU</span>
      </a>
      <nav class="header-nav">
        <button id="theme-toggle" class="theme-toggle" aria-label="Alternar tema">
          <span class="icon-sun">☀️</span><span class="icon-moon">🌙</span>
        </button>
        <a href="index.html" class="nav-link">Sair da Missão</a>
      </nav>
    </div>
  </header>

  <main class="game-container">
    <section class="game-stage">
      <div class="chat-history" id="chat-history"></div>
      <div class="chat-input-area">
        <form id="chat-form">
          <input type="text" id="chat-input" placeholder="Digite sua resposta em inglês..." autocomplete="off">
          <button type="submit" class="btn btn-primary">Enviar</button>
        </form>
        <div class="quick-replies" id="quick-replies"></div>
      </div>
    </section>

    <aside class="game-sidebar">
      <div class="hud-section">
        <h3>Missão Atual</h3>
        <p class="mission-title" id="mission-title">Carregando...</p>
      </div>
      <div class="stats-section">
        <div class="stat-item">
          <span class="stat-icon">💵</span>
          <div class="stat-info">
            <span class="stat-label">Dinheiro</span>
            <span class="stat-value" id="stat-money">$ 0.00</span>
          </div>
        </div>
        <div class="stat-item">
          <span class="stat-icon">🔋</span>
          <div class="stat-info">
            <span class="stat-label">Energia</span>
            <span class="stat-value" id="stat-energy">0/100</span>
          </div>
        </div>
      </div>
      <div class="glossary-section">
        <h3>Glossário</h3>
        <ul class="glossary-list" id="glossary-list"></ul>
      </div>
    </aside>
  </main>

  <script src="src/data/b1_data.js"></script>
  <script src="src/engine/game.js"></script>
  <script>
    document.getElementById('theme-toggle').addEventListener('click', () => {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('ventu-theme', newTheme);
    });
  </script>
</body>
</html>
