<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ventu - Entrar ou Cadastrar</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg: #0b0f19; --panel: #151b2b; --text: #e2e8f0; --text-muted: #94a3b8; --gold: #fbbf24; --border: #1e293b; }
        * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100dvh; margin: 0; padding: 20px; }
        .auth-box { background: var(--panel); padding: 30px; border-radius: 12px; width: 100%; max-width: 400px; border: 1px solid var(--border); box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h2 { text-align: center; color: var(--gold); margin-bottom: 25px; font-size: 1.5rem; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 8px; outline: none; font-size: 0.95rem; }
        input:focus { border-color: var(--gold); }
        button { width: 100%; padding: 12px; background: var(--gold); color: var(--bg); font-weight: bold; border: none; border-radius: 8px; cursor: pointer; margin-bottom: 15px; font-size: 0.95rem; transition: 0.2s; }
        button:hover:not(:disabled) { background: #f59e0b; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-google { background: white; color: #333; display: flex; justify-content: center; align-items: center; gap: 10px; border: 1px solid #ccc; }
        .btn-google:hover { background: #f1f1f1; }
        .link { color: var(--text-muted); text-decoration: none; font-size: 0.9rem; display: block; text-align: center; margin-top: 15px; cursor: pointer; transition: 0.2s; }
        .link:hover { color: var(--gold); }
        .hidden { display: none; }
    </style>
</head>
<body>
<div class="auth-box">
    <h2 id="titulo">Entrar no Ventu</h2>
    
    <form id="form-auth">
        <div id="campos-cadastro" class="hidden">
            <input type="text" id="nome" placeholder="Seu nome completo" required>
            <input type="tel" id="telefone" placeholder="(11) 9 9999-9999" maxlength="16" required>
        </div>
        
        <input type="email" id="email" placeholder="Seu e-mail" required>
        <input type="password" id="senha" placeholder="Sua senha" required>
        
        <button type="submit" id="btn-submit">Entrar</button>
    </form>

    <button class="btn-google" id="btn-google" type="button">
        <img src="https://www.svgrepo.com/show/475656/google-color.svg" width="20" alt="Google"> Entrar com Google
    </button>

    <a class="link" id="toggle-auth">Não tem conta? Cadastre-se</a>
    <a class="link" id="btn-esqueci-senha">Esqueci minha senha</a>
</div>

<script src="src/engine/auth.js"></script>
<script>
    let isLogin = true;
    const form = document.getElementById('form-auth');
    const camposCadastro = document.getElementById('campos-cadastro');
    const titulo = document.getElementById('titulo');
    const btnSubmit = document.getElementById('btn-submit');
    const telefoneInput = document.getElementById('telefone');

    telefoneInput.addEventListener('input', () => aplicarMascaraTelefone(telefoneInput));

    document.getElementById('toggle-auth').addEventListener('click', (e) => {
        e.preventDefault();
        isLogin = !isLogin;
        camposCadastro.classList.toggle('hidden', isLogin);
        titulo.innerText = isLogin ? 'Entrar no Ventu' : 'Criar Conta';
        btnSubmit.innerText = isLogin ? 'Entrar' : 'Cadastrar';
        document.getElementById('toggle-auth').innerText = isLogin ? 'Não tem conta? Cadastre-se' : 'Já tem conta? Faça login';
    });

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        btnSubmit.disabled = true;
        btnSubmit.innerText = 'Carregando...';

        const email = document.getElementById('email').value;
        const senha = document.getElementById('senha').value;

        try {
            if (isLogin) {
                await fazerLogin(email, senha);
                window.location.href = 'jogo.html'; 
            } else {
                const nome = document.getElementById('nome').value;
                const telefone = telefoneInput.value;
                await fazerCadastro(email, senha, nome, telefone);
                alert('Conta criada com sucesso!');
                window.location.href = 'jogo.html'; 
            }
        } catch (error) {
            alert('Erro: ' + error.message);
        } finally {
            btnSubmit.disabled = false;
            btnSubmit.innerText = isLogin ? 'Entrar' : 'Cadastrar';
        }
    });

    document.getElementById('btn-google').addEventListener('click', loginComGoogle);

    document.getElementById('btn-esqueci-senha').addEventListener('click', async (e) => {
        e.preventDefault();
        const email = prompt('Digite seu e-mail para recuperar a senha:');
        if (email) {
            try {
                await recuperarSenha(email);
                alert('E-mail de recuperação enviado! Confira sua caixa de entrada.');
            } catch (error) {
                alert('Erro: ' + error.message);
            }
        }
    });
</script>
</body>
</html>
