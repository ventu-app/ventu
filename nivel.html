<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dossiê do Nível — Ventu</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="src/styles/global.css">
  <link rel="stylesheet" href="src/styles/home.css">
  <link rel="stylesheet" href="src/styles/nivel.css">
  <script>
    const savedTheme = localStorage.getItem('ventu-theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
  </script>
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">
        <svg width="40" height="40" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <path d="M 14 52 L 22 8 L 42 40 Z" fill="#fbbf24"/><path d="M 86 52 L 78 8 L 58 40 Z" fill="#fbbf24"/><path d="M 22 46 L 25 22 L 36 38 Z" fill="#ea580c"/><path d="M 78 46 L 75 22 L 64 38 Z" fill="#ea580c"/><path d="M 10 48 Q 10 78, 50 96 Q 90 78, 90 48 Q 90 38, 80 38 L 20 38 Q 10 38, 10 48 Z" fill="#fbbf24"/><path d="M 50 92 Q 35 84, 32 72 Q 40 76, 50 76 Q 60 76, 68 72 Q 65 84, 50 92 Z" fill="#fef3c7"/><ellipse cx="35" cy="58" rx="3.5" ry="5" fill="#0b0f19"/><ellipse cx="65" cy="58" rx="3.5" ry="5" fill="#0b0f19"/><circle cx="36" cy="56" r="1.2" fill="#fff"/><circle cx="66" cy="56" r="1.2" fill="#fff"/><path d="M 46 72 L 54 72 L 50 78 Z" fill="#0b0f19"/>
        </svg>
        <span class="logo-text">VENTU</span>
      </a>
      
      <nav class="header-nav">
        <button id="theme-toggle" class="theme-toggle" aria-label="Alternar tema">
          <span class="icon-sun">☀️</span>
          <span class="icon-moon">🌙</span>
        </button>
        <a href="apoie.html" class="btn btn-support">Apoiar <span>🦊</span></a>
        <a href="index.html" class="nav-link">Voltar</a>
      </nav>

      <button class="menu-toggle" id="menu-toggle">☰</button>
    </div>
  </header>

  <!-- Menu Mobile -->
  <div class="mobile-menu" id="mobile-menu">
    <a href="apoie.html" class="btn btn-support">Apoiar Projeto 🦊</a>
    <a href="index.html" class="btn btn-ghost">Voltar para a Home</a>
  </div>

  <main class="dossier-main">
    <div class="container" id="dossier-container"></div>
  </main>

  <script src="src/data/levels.js"></script>
  <script>
    // Theme Toggle
    document.getElementById('theme-toggle').addEventListener('click', () => {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('ventu-theme', newTheme);
    });

    // Mobile Menu Toggle
    const menuToggle = document.getElementById('menu-toggle');
    const mobileMenu = document.getElementById('mobile-menu');
    menuToggle.addEventListener('click', () => {
      mobileMenu.classList.toggle('active');
      menuToggle.textContent = mobileMenu.classList.contains('active') ? '✕' : '☰';
    });

    const urlParams = new URLSearchParams(window.location.search);
    const levelId = urlParams.get('l') || 'a1';
    const level = levelsData.find(l => l.id === levelId);
    const container = document.getElementById('dossier-container');

    if (!level || !level.available) {
      container.innerHTML = `<div class="error-state"><h2>Nível não encontrado ou bloqueado.</h2><a href="index.html" class="btn btn-primary" style="margin-top: 20px;">Voltar para a Home</a></div>`;
    } else {
      document.documentElement.style.setProperty('--current-level-color', level.color);
      document.title = `${level.title} — Ventu`;

      let objectivesHTML = '';
      if (level.objectives && level.objectives.length > 0) {
        objectivesHTML = `
          <div class="briefing-card">
            <h3>O que você vai aprender</h3>
            <ul class="objectives-list">
              ${level.objectives.map(obj => `<li>${obj}</li>`).join('')}
            </ul>
          </div>
        `;
      }

      container.innerHTML = `
        <div class="dossier-header">
          <span class="level-badge" style="background: ${level.color}; color: var(--bg-base);">${level.cefr}</span>
          <h1 class="dossier-title">${level.title}</h1>
          <p class="dossier-desc">${level.desc}</p>
        </div>

        <div class="dossier-content">
          <div class="briefing-section">
            <div class="briefing-card ventu-card">
              <div class="ventu-avatar">
                <svg viewBox="0 0 100 100" width="60" height="60">
                  <path d="M 14 52 L 22 8 L 42 40 Z" fill="#fbbf24"/><path d="M 86 52 L 78 8 L 58 40 Z" fill="#fbbf24"/><path d="M 22 46 L 25 22 L 36 38 Z" fill="#ea580c"/><path d="M 78 46 L 75 22 L 64 38 Z" fill="#ea580c"/><path d="M 10 48 Q 10 78, 50 96 Q 90 78, 90 48 Q 90 38, 80 38 L 20 38 Q 10 38, 10 48 Z" fill="#fbbf24"/><path d="M 50 92 Q 35 84, 32 72 Q 40 76, 50 76 Q 60 76, 68 72 Q 65 84, 50 92 Z" fill="#fef3c7"/><ellipse cx="35" cy="58" rx="3.5" ry="5" fill="#0b0f19"/><ellipse cx="65" cy="58" rx="3.5" ry="5" fill="#0b0f19"/><path d="M 46 72 L 54 72 L 50 78 Z" fill="#0b0f19"/>
                </svg>
              </div>
              <div class="ventu-speech">
                <h3>A Ventu diz:</h3>
                <p>"${level.ventuSays}"</p>
              </div>
            </div>
            ${objectivesHTML}
          </div>

          <div class="action-section">
            <a href="jogo.html?l=${level.id}" class="btn btn-primary btn-lg">Iniciar Missão</a>
            <p class="action-hint">Você pode sair e voltar depois. O progresso é salvo automaticamente.</p>
          </div>
        </div>
      `;
    }
  </script>
</body>
</html>
