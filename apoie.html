<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apoiar o Ventu 🦊</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f19; --panel: #151b2b; --text: #e2e8f0; --text-muted: #94a3b8;
      --gold: #fbbf24; --gold-hover: #f59e0b; --border: #1e293b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; text-align: center; }
    .container { background: var(--panel); border: 1px solid var(--border); padding: 40px 30px; border-radius: 16px; max-width: 500px; width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .fox { font-size: 4rem; margin-bottom: 20px; animation: float 3s infinite ease-in-out; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    h1 { color: var(--gold); font-size: 2rem; margin-bottom: 15px; }
    p { color: var(--text-muted); line-height: 1.6; margin-bottom: 25px; font-size: 1rem; }
    
    .qr-container { background: white; padding: 15px; border-radius: 12px; display: inline-block; margin-bottom: 25px; }
    .qr-container img { display: block; width: 200px; height: 200px; }
    
    .pix-container { margin-bottom: 25px; }
    .pix-label { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 8px; display: block; text-align: left; font-weight: 600;}
    .pix-box { 
      background: var(--bg); border: 1px dashed var(--gold); padding: 15px; 
      border-radius: 8px; font-family: monospace; font-size: 0.95rem; 
      color: var(--gold); word-break: break-all; cursor: pointer; 
      transition: 0.2s; position: relative; display: flex; justify-content: space-between; align-items: center;
    }
    .pix-box:hover { background: rgba(251, 191, 36, 0.1); }
    
    .btn { background: var(--gold); color: var(--bg); text-decoration: none; padding: 12px 24px; border-radius: 8px; font-weight: bold; display: inline-block; transition: 0.2s; border: none; cursor: pointer; width: 100%; font-size: 1rem;}
    .btn:hover { background: var(--gold-hover); transform: translateY(-2px); }
    
    .toast { position: fixed; bottom: -50px; left: 50%; transform: translateX(-50%); background: #10b981; color: white; padding: 10px 20px; border-radius: 8px; font-weight: bold; transition: bottom 0.3s; z-index: 1000; }
    .toast.show { bottom: 20px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="fox">🦊</div>
    <h1>Ajude o Ventu a crescer!</h1>
    <p>O Ventu é um projeto independente. Se você gosta do jogo e quer ajudar a manter os servidores no ar, considere apoiar via PIX.</p>
    
    <!-- QR CODE -->
    <div class="qr-container">
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=cd5e70df-ddb5-4c74-8589-bee68ed718d0" alt="QR Code PIX">
    </div>

    <div class="pix-container">
      <span class="pix-label">Ou copie a chave PIX:</span>
      <div class="pix-box" onclick="copiarPix()">
        <span>cd5e70df-ddb5-4c74-8589-bee68ed718d0</span>
        <span style="font-size: 1.2rem;">📋</span>
      </div>
    </div>
    
    <a href="/" class="btn">Voltar para o Jogo</a>
  </div>

  <div id="toast" class="toast">Chave PIX copiada! 🦊</div>

  <script>
    function copiarPix() {
      const chave = "cd5e70df-ddb5-4c74-8589-bee68ed718d0";
      navigator.clipboard.writeText(chave).then(() => {
        const toast = document.getElementById('toast');
        toast.classList.add('show');
        setTimeout(() => { toast.classList.remove('show'); }, 3000);
      }).catch(err => {
        alert("Erro ao copiar. A chave é: " + chave);
      });
    }
  </script>
</body>
</html>
