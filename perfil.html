<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Perfil — Ventu</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    try { document.documentElement.setAttribute('data-theme', localStorage.getItem('ventu-theme') || 'dark'); } catch(e) {}
  </script>
  <style>
    :root { --bg: #0b0f19; --panel: #151b2b; --text: #e2e8f0; --text-muted: #94a3b8; --gold: #fbbf24; --border: #1e293b; --error: #ef4444; --success: #10b981; }
    [data-theme="light"] { --bg: #f8fafc; --panel: #ffffff; --text: #0f172a; --text-muted: #64748b; --gold: #d97706; --border: #e2e8f0; --error: #dc2626; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; display: flex; flex-direction: column; transition: 0.3s; }
    a { text-decoration: none; color: inherit; }
    
    .site-header { background: var(--panel); border-bottom: 1px solid var(--border); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-family: 'Playfair Display', serif; font-size: 1.5rem; font-weight: 900; color: var(--text); text-decoration: none; display: flex; align-items: center; gap: 10px; }
    .btn-back { color: var(--gold); font-weight: bold; text-decoration: none; font-size: 0.95rem; }

    .container { max-width: 800px; margin: 40px auto; padding: 0 20px; width: 100%; flex: 1; }
    
    /* Card do Perfil */
    .profile-card { background: var(--panel); border: 1px solid var(--border); border-radius: 20px; padding: 40px; display: flex; gap: 30px; align-items: flex-start; flex-wrap: wrap; margin-bottom: 30px; position: relative; }
    
    .avatar-wrapper { position: relative; cursor: pointer; }
    .avatar { width: 120px; height: 120px; border-radius: 50%; background: var(--bg); border: 3px solid var(--gold); display: flex; justify-content: center; align-items: center; font-size: 4.5rem; transition: 0.2s; }
    .avatar:hover { transform: scale(1.05); box-shadow: 0 0 15px rgba(251, 191, 36, 0.4); }
    .edit-badge { position: absolute; bottom: 0; right: 0; background: var(--gold); color: var(--bg); width: 35px; height: 35px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 1rem; border: 2px solid var(--panel); }

    .info { flex: 1; min-width: 250px; }
    .info h2 { margin-bottom: 5px; font-size: 2rem; color: var(--text); }
    .info .email { color: var(--text-muted); margin-bottom: 15px; font-size: 0.95rem; }
    .info .joined { color: var(--gold); font-size: 0.85rem; margin-bottom: 15px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
    
    .badge-display { display: inline-block; background: rgba(251, 191, 36, 0.1); border: 1px solid var(--gold); color: var(--gold); padding: 5px 15px; border-radius: 20px; font-weight: bold; font-size: 0.9rem; }
    
    .bio-input { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 10px; border-radius: 8px; font-family: inherit; resize: vertical; min-height: 60px; outline: none; margin-bottom: 10px; }
    .bio-input:focus { border-color: var(--gold); }
    .btn-save-bio { background: var(--gold); color: var(--bg); border: none; padding: 8px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.85rem; }
    .btn-save-bio:disabled { opacity: 0.5; cursor: not-allowed; }

    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 20px; margin-top: 30px; width: 100%; border-top: 1px solid var(--border); padding-top: 30px; }
    .stat-box { background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 20px; text-align: center; }
    .stat-box h3 { color: var(--gold); font-size: 2rem; margin-bottom: 5px; }
    .stat-box p { color: var(--text-muted); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; font-weight: bold; }

    /* Zona de Perigo */
    .danger-zone { margin-top: 40px; padding: 20px; border: 1px dashed var(--error); border-radius: 12px; text-align: center; background: rgba(239, 68, 68, 0.05); }
    .danger-zone h3 { color: var(--error); margin-bottom: 10px; font-size: 1.2rem; }
    .danger-zone p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 15px; }
    .btn-danger { background: transparent; border: 1px solid var(--error); color: var(--error); padding: 10px 20px; border-radius: 8px; cursor: pointer; transition: 0.2s; font-weight: bold; }
    .btn-danger:hover { background: var(--error); color: white; }

    /* Modal de Avatares */
    .modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); display: none; justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: var(--panel); padding: 30px; border-radius: 20px; border: 1px solid var(--border); max-width: 400px; width: 90%; text-align: center; }
    .modal-content h3 { color: var(--gold); margin-bottom: 20px; }
    .avatar-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 20px; }
    .avatar-option { font-size: 2.5rem; background: var(--bg); border: 2px solid var(--border); border-radius: 12px; padding: 10px; cursor: pointer; transition: 0.2s; }
    .avatar-option:hover { border-color: var(--gold); transform: scale(1.1); }
    .btn-close-modal { background: var(--border); color: var(--text); border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 10px; }

    .error-msg { color: var(--error); margin-top: 10px; font-size: 0.9rem; font-weight: bold; }
    .success-msg { color: var(--success); margin-top: 10px; font-size: 0.9rem; font-weight: bold; }
  </style>
</head>
<body>
  <header class="site-header">
    <a href="/" class="logo">
      <svg width="30" height="30" viewBox="0 0 100 100"><path d="M 14 52 L 22 8 L 42 40 Z" fill="#fbbf24"/><path d="M 86 52 L 78 8 L 58 40 Z" fill="#fbbf24"/><path d="M 10 48 Q 10 78, 50 96 Q 90 78, 90 48 Q 90 38, 80 38 L 20 38 Q 10 38, 10 48 Z" fill="#fbbf24"/><path d="M 50 92 Q 35 84, 32 72 Q 40 76, 50 76 Q 60 76, 68 72 Q 65 84, 50 92 Z" fill="#fef3c7"/><ellipse cx="35" cy="58" rx="3.5" ry="5" fill="#0b0f19"/><ellipse cx="65" cy="58" rx="3.5" ry="5" fill="#0b0f19"/><path d="M 46 72 L 54 72 L 50 78 Z" fill="#0b0f19"/></svg>
      VENTU
    </a>
    <a href="dashboard.html" class="btn-back">← Voltar ao Dashboard</a>
  </header>

  <main class="container">
    <div class="profile-card">
      
      <div class="avatar-wrapper" id="btn-open-modal">
        <div class="avatar" id="user-avatar">🦊</div>
        <div class="edit-badge">✏️</div>
      </div>

      <div class="info">
        <h2 id="user-name">Carregando...</h2>
        <p class="email" id="user-email">...</p>
        <p class="joined" id="user-joined"></p>
        <div class="badge-display" id="user-badge">Novato</div>
        
        <div style="margin-top: 20px;">
            <textarea class="bio-input" id="user-bio" placeholder="Escreva uma bio curta sobre você..." maxlength="100"></textarea>
            <button class="btn-save-bio" id="btn-save-bio">Salvar Bio</button>
            <span id="bio-msg" style="font-size: 0.8rem; margin-left: 10px;"></span>
        </div>
      </div>
      
      <div class="stats-grid">
        <div class="stat-box">
          <h3 id="stat-xp">0</h3>
          <p>XP Total</p>
        </div>
        <div class="stat-box">
          <h3 id="stat-levels">0</h3>
          <p>Missões Concluídas</p>
        </div>
      </div>
    </div>

    <div class="danger-zone">
      <h3>Zona de Perigo</h3>
      <p>Ao deletar sua conta, todos os seus dados (XP e progresso) serão apagados permanentemente.</p>
      <button class="btn-danger" id="btn-delete">Excluir minha conta</button>
    </div>
  </main>

  <!-- Modal de Avatares -->
  <div class="modal" id="avatar-modal">
    <div class="modal-content">
      <h3>Escolha seu Avatar</h3>
      <div class="avatar-grid">
        <div class="avatar-option" data-emoji="🦊">🦊</div>
        <div class="avatar-option" data-emoji="🐺">🐺</div>
        <div class="avatar-option" data-emoji="🐯">🐯</div>
        <div class="avatar-option" data-emoji="🦁">🦁</div>
        <div class="avatar-option" data-emoji="🐸">🐸</div>
        <div class="avatar-option" data-emoji="🐼">🐼</div>
        <div class="avatar-option" data-emoji="👾">👾</div>
        <div class="avatar-option" data-emoji="🤖">🤖</div>
        <div class="avatar-option" data-emoji="👩‍💻">👩‍💻</div>
        <div class="avatar-option" data-emoji="👨‍🍳">👨‍🍳</div>
        <div class="avatar-option" data-emoji="🕵️‍♀️">🕵️‍♀️</div>
        <div class="avatar-option" data-emoji="🧛">🧛</div>
      </div>
      <button class="btn-close-modal" id="btn-close-modal">Cancelar</button>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const SUPABASE_URL = 'https://hbqjoadubrwuafbfykre.supabase.co';
      const SUPABASE_ANON_KEY = 'sb_publishable_Wg3q6v4-ZbVK_9WQXnuFpQ_CZXH68L_';
      
      if (!window.supabase) return;
      const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      let currentUser = null;

      try {
        const { data: { session }, error: sessionError } = await supabase.auth.getSession();
        if (sessionError || !session) {
          window.location.href = 'auth.html';
          return;
        }

        currentUser = session.user;
        
        // 1. Preencher Nome e Email
        const email = currentUser.email || 'Email não informado';
        const name = currentUser.user_metadata?.full_name || email.split('@')[0];
        const avatarEmoji = currentUser.user_metadata?.avatar_emoji || '🦊';
        const bioText = currentUser.user_metadata?.bio || '';
        
        document.getElementById('user-name').innerText = name;
        document.getElementById('user-email').innerText = email;
        document.getElementById('user-avatar').innerText = avatarEmoji;
        document.getElementById('user-bio').value = bioText;

        // Data de Membro
        const joinedDate = new Date(currentUser.created_at);
        const months = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
        document.getElementById('user-joined').innerText = `Membro desde ${months[joinedDate.getMonth()]} de ${joinedDate.getFullYear()}`;

        // 2. Buscar XP (com maybeSingle para não quebrar)
        const { data: profile, error: profileError } = await supabase
            .from('profiles')
            .select('xp, levels_completed')
            .eq('id', currentUser.id)
            .maybeSingle(); // <-- CORREÇÃO AQUI

        if (profileError) {
            console.error("Erro no banco:", profileError);
        }

        let xp = 0;
        let totalLevels = 0;

        if (profile) {
            xp = profile.xp || 0;
            if (profile.levels_completed) {
                Object.keys(profile.levels_completed).forEach(level => {
                    if (Array.isArray(profile.levels_completed[level])) {
                        totalLevels += profile.levels_completed[level].length;
                    }
                });
            }
        }

        document.getElementById('stat-xp').innerText = xp;
        document.getElementById('stat-levels').innerText = totalLevels;

        // Definir Badge com base no XP
        let badge = "Novato";
        if (xp >= 1000) badge = "Lenda do Caos";
        else if (xp >= 500) badge = "Veterano";
        else if (xp >= 150) badge = "Sobrevivente";
        document.getElementById('user-badge').innerText = badge;

      } catch (err) {
        console.error("Erro geral:", err);
      }

      // --- LÓGICA DO AVATAR MODAL ---
      const modal = document.getElementById('avatar-modal');
      document.getElementById('btn-open-modal').addEventListener('click', () => modal.style.display = 'flex');
      document.getElementById('btn-close-modal').addEventListener('click', () => modal.style.display = 'none');

      document.querySelectorAll('.avatar-option').forEach(opt => {
          opt.addEventListener('click', async () => {
              const newEmoji = opt.getAttribute('data-emoji');
              document.getElementById('user-avatar').innerText = newEmoji;
              modal.style.display = 'none';
              
              // Salva no Supabase Auth
              const { error } = await supabase.auth.updateUser({
                  data: { avatar_emoji: newEmoji }
              });
              if (error) alert("Erro ao salvar avatar: " + error.message);
          });
      });

      // --- LÓGICA DA BIO ---
      document.getElementById('btn-save-bio').addEventListener('click', async () => {
          const bio = document.getElementById('user-bio').value;
          const btn = document.getElementById('btn-save-bio');
          const msg = document.getElementById('bio-msg');
          
          btn.disabled = true;
          btn.innerText = "Salvando...";

          const { error } = await supabase.auth.updateUser({
              data: { bio: bio }
          });

          btn.disabled = false;
          btn.innerText = "Salvar Bio";

          if (error) {
              msg.style.color = "var(--error)";
              msg.innerText = "Erro ao salvar.";
          } else {
              msg.style.color = "var(--success)";
              msg.innerText = "Bio atualizada!";
              setTimeout(() => msg.innerText = '', 3000);
          }
      });

      // --- BOTÃO DELETAR ---
      document.getElementById('btn-delete').addEventListener('click', async () => {
          if (confirm("Tem certeza que deseja excluir sua conta? Essa ação não pode ser desfeita.")) {
              await supabase.auth.signOut();
              alert("Sessão encerrada. Para deletar permanentemente, entre em contato pelo Instagram @porphirio.brayam.");
              window.location.href = 'auth.html';
          }
      });
    });
  </script>
</body>
</html>
