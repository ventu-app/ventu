<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Perfil — Ventu</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { --bg: #0b0f19; --panel: #151b2b; --text: #e2e8f0; --text-muted: #94a3b8; --gold: #fbbf24; --border: #1e293b; --error: #ef4444; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
    .header { background: var(--panel); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
    .logo { font-family: 'Playfair Display', serif; font-size: 1.5rem; font-weight: 900; color: var(--text); text-decoration: none; display: flex; align-items: center; gap: 10px; }
    .container { max-width: 800px; margin: 40px auto; padding: 0 20px; width: 100%; flex: 1; }
    .profile-card { background: var(--panel); border: 1px solid var(--border); border-radius: 20px; padding: 40px; display: flex; gap: 30px; align-items: center; flex-wrap: wrap; }
    .avatar { width: 100px; height: 100px; border-radius: 50%; background: var(--gold); display: flex; justify-content: center; align-items: center; font-size: 3rem; color: var(--bg); font-family: 'Playfair Display', serif; font-weight: bold; }
    .info h2 { margin-bottom: 5px; font-size: 1.8rem; }
    .info p { color: var(--text-muted); margin-bottom: 15px; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 20px; margin-top: 30px; }
    .stat-box { background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 20px; text-align: center; }
    .stat-box h3 { color: var(--gold); font-size: 2rem; margin-bottom: 5px; }
    .stat-box p { color: var(--text-muted); font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; }
    .danger-zone { margin-top: 40px; padding: 20px; border: 1px dashed var(--error); border-radius: 12px; text-align: center; }
    .danger-zone h3 { color: var(--error); margin-bottom: 10px; }
    .danger-zone p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 15px; }
    .btn-danger { background: transparent; border: 1px solid var(--error); color: var(--error); padding: 10px 20px; border-radius: 8px; cursor: pointer; transition: 0.2s; font-weight: bold; }
    .btn-danger:hover { background: rgba(239,68,68,0.1); }
    .btn-back { display: inline-block; margin-top: 20px; color: var(--gold); text-decoration: none; font-weight: bold; }
  </style>
</head>
<body>
  <header class="header">
    <a href="/" class="logo">
      <svg width="30" height="30" viewBox="0 0 100 100"><path d="M 14 52 L 22 8 L 42 40 Z" fill="#fbbf24"/><path d="M 86 52 L 78 8 L 58 40 Z" fill="#fbbf24"/><path d="M 10 48 Q 10 78, 50 96 Q 90 78, 90 48 Q 90 38, 80 38 L 20 38 Q 10 38, 10 48 Z" fill="#fbbf24"/><path d="M 50 92 Q 35 84, 32 72 Q 40 76, 50 76 Q 60 76, 68 72 Q 65 84, 50 92 Z" fill="#fef3c7"/><ellipse cx="35" cy="58" rx="3.5" ry="5" fill="#0b0f19"/><ellipse cx="65" cy="58" rx="3.5" ry="5" fill="#0b0f19"/><path d="M 46 72 L 54 72 L 50 78 Z" fill="#0b0f19"/></svg>
      VENTU
    </a>
    <a href="dashboard.html" class="btn-back" style="margin-top:0;">Voltar ao Dashboard</a>
  </header>

  <main class="container">
    <div class="profile-card" id="profile-card" style="display: none;">
      <div class="avatar" id="user-avatar">V</div>
      <div class="info">
        <h2 id="user-name">Carregando...</h2>
        <p id="user-email">...</p>
      </div>
      
      <div class="stats-grid" style="width: 100%; margin-top: 20px;">
        <div class="stat-box">
          <h3 id="stat-xp">0</h3>
          <p>XP Total</p>
        </div>
        <div class="stat-box">
          <h3 id="stat-levels">0</h3>
          <p>Perspectivas Concluídas</p>
        </div>
      </div>
    </div>

    <div class="danger-zone">
      <h3>Zona de Perigo</h3>
      <p>Ao deletar sua conta, todos os seus dados (XP e progresso) serão apagados permanentemente.</p>
      <button class="btn-danger" id="btn-delete">Excluir minha conta</button>
    </div>
  </main>

  <script>
    const supabase = window.supabase.createClient('https://hbqjoadubrwuafbfykre.supabase.co', 'sb_publishable_Wg3q6v4-ZbVK_9WQXnuFpQ_CZXH68L_');
    
    document.addEventListener('DOMContentLoaded', async () => {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) {
        window.location.href = 'auth.html';
        return;
      }

      const user = session.user;
      const name = user.user_metadata?.full_name || user.email.split('@')[0];
      
      document.getElementById('user-avatar').innerText = name.charAt(0).toUpperCase();
      document.getElementById('user-name').innerText = name;
      document.getElementById('user-email').innerText = user.email;
      document.getElementById('profile-card').style.display = 'flex';

      // Buscar XP e Levels
      const { data: profile } = await supabase.from('profiles').select('xp, levels_completed').eq('id', user.id).single();
      
      if (profile) {
        document.getElementById('stat-xp').innerText = profile.xp || 0;
        
        let totalLevels = 0;
        if (profile.levels_completed) {
            Object.keys(profile.levels_completed).forEach(level => {
                if (Array.isArray(profile.levels_completed[level])) {
                    totalLevels += profile.levels_completed[level].length;
                }
            });
        }
        document.getElementById('stat-levels').innerText = totalLevels;
      }
    });

    // Delete Account (Aviso: O Supabase exige RLS ou uma Edge Function para deletar, então faremos um aviso por enquanto)
    document.getElementById('btn-delete').addEventListener('click', async () => {
        if (confirm("Tem certeza que deseja excluir sua conta? Essa ação não pode ser desfeita.")) {
            // Para deletar a conta de fato, precisariamos de uma Edge Function no Supabase
            // Por enquanto, apenas deslogamos e avisamos o usuário
            await supabase.auth.signOut();
            alert("Sessão encerrada. Para deletar permanentemente, entre em contato pelo Instagram @porphirio.brayam.");
            window.location.href = 'auth.html';
        }
    });
  </script>
</body>
</html>
