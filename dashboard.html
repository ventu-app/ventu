<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Meu Dashboard - Ventu</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg: #0b0f19; --panel: #151b2b; --text: #e2e8f0; --text-muted: #94a3b8;
            --gold: #fbbf24; --gold-hover: #f59e0b; --border: #1e293b; --error: #ef4444;
            --purple: #8b5cf6; --green: #10b981;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background-color: var(--bg); color: var(--text); min-height: 100dvh; display: flex; flex-direction: column; }

        header { background-color: var(--panel); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
        .logo { font-size: 1.5rem; font-weight: bold; color: var(--gold); display: flex; align-items: center; gap: 10px; text-decoration: none; }
        .nav-buttons { display: flex; gap: 15px; align-items: center; }
        .btn-auth { background: transparent; color: var(--text); border: 1px solid var(--border); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; text-decoration: none; font-size: 0.9rem;}
        .btn-auth:hover { border-color: var(--gold); color: var(--gold); }
        .user-email { font-size: 0.85rem; color: var(--text-muted); }
        .xp-badge { color: var(--gold); font-weight: bold; margin-right: 10px; background: rgba(251, 191, 36, 0.1); padding: 5px 10px; border-radius: 20px; border: 1px solid rgba(251, 191, 36, 0.2); }

        .container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; width: 100%; flex: 1; }
        .section-title { font-size: 1.8rem; color: var(--gold); margin-bottom: 10px; }
        .section-subtitle { color: var(--text-muted); margin-bottom: 30px; font-size: 1rem; }
        
        .levels-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 25px; }
        
        @media (max-width: 900px) { .levels-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 600px) { .levels-grid { grid-template-columns: 1fr; } }

        .level-card { 
            background: var(--panel); border: 1px solid var(--border); border-radius: 16px; 
            padding: 25px; transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); position: relative; overflow: hidden;
            display: flex; flex-direction: column; cursor: pointer; text-decoration: none; color: var(--text);
        }
        
        .level-card:hover:not(.locked) { 
            border-color: var(--level-color, var(--gold)); 
            transform: translateY(-8px) scale(1.02); 
            box-shadow: 0 15px 30px rgba(0,0,0,0.4), 0 0 15px var(--level-color, rgba(251, 191, 36, 0.2)); 
        }
        
        .level-card.locked { opacity: 0.6; filter: grayscale(0.8); cursor: not-allowed; }
        .level-card.locked:hover { transform: none; border-color: var(--border); box-shadow: none; }
        
        .level-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; }
        .level-icon { font-size: 2.5rem; background: var(--bg); width: 60px; height: 60px; display: flex; align-items: center; justify-content: center; border-radius: 12px; border: 1px solid var(--border); }
        
        .level-badge { font-size: 0.65rem; padding: 6px 10px; border-radius: 20px; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px; border: 1px solid; }
        .badge-ready { background: rgba(16, 185, 129, 0.15); color: var(--green); border-color: rgba(16, 185, 129, 0.3); }
        .badge-soon { background: rgba(148, 163, 184, 0.1); color: var(--text-muted); border-color: rgba(148, 163, 184, 0.2); }
        .badge-special { background: rgba(139, 92, 246, 0.15); color: var(--purple); border-color: rgba(139, 92, 246, 0.3); }
        
        .level-card h3 { font-size: 1.3rem; color: var(--text); margin-bottom: 5px; }
        .level-card .subtitle { font-size: 0.8rem; color: var(--level-color, var(--gold)); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; display: block; font-weight: bold;}
        .level-card p { font-size: 0.9rem; color: var(--text-muted); line-height: 1.5; flex: 1; margin-bottom: 20px; }
        
        .play-btn { 
            background: transparent; color: var(--text); border: 1px solid var(--border); padding: 12px; 
            border-radius: 8px; font-weight: bold; cursor: pointer; text-align: center; 
            transition: 0.2s; width: 100%; display: flex; justify-content: center; align-items: center; gap: 8px;
            font-size: 0.9rem; margin-top: auto;
        }
        .level-card:hover:not(.locked) .play-btn { background: var(--level-color, var(--gold)); color: var(--bg); border-color: var(--level-color, var(--gold)); }
        .level-card.locked .play-btn { border-style: dashed; color: var(--text-muted); }

        #modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 999; padding: 20px; backdrop-filter: blur(5px); }
        .modal-box { background: var(--panel); padding: 30px; border-radius: 12px; border: 1px solid var(--gold); max-width: 400px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); animation: fadeIn 0.3s ease;}
        .modal-box h2 { color: var(--gold); margin-bottom: 15px; font-size: 1.5rem; }
        .modal-box p { color: var(--text); margin-bottom: 25px; line-height: 1.5; }
        .btn-close { background: var(--border); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; transition: 0.2s; }
        .btn-close:hover { background: var(--text-muted); }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">🦊 Ventu</a>
        <div class="nav-buttons" id="auth-area">
            <!-- Preenchido via JS -->
        </div>
    </header>

    <div class="container">
        <h2 class="section-title">Meu Dashboard</h2>
        <p class="section-subtitle">Escolha o seu próximo desafio. Sobreviva, aprenda e ganhe XP.</p>
        
        <div class="levels-grid" id="levels-container">
            <!-- Preenchido via JS -->
        </div>
    </div>

    <div id="modal-overlay">
        <div class="modal-box">
            <h2>🚧 Em Breve / Coming Soon</h2>
            <p id="modal-text">O nível <strong id="modal-name"></strong> está em desenvolvimento. Continue praticando nos níveis liberados!</p>
            <button class="btn-close" onclick="document.getElementById('modal-overlay').style.display='none'">Entendido</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://hbqjoadubrwuafbfykre.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_Wg3q6v4-ZbVK_9WQXnuFpQ_CZXH68L_';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const levels = [
            { id: 'a1', title: 'Burger Palace', subtitle: 'Nível A1 - Iniciante', icon: '🍔', desc: 'Sobreviva ao caos de uma lanchonete com funcionários perdidos e clientes furiosos.', status: 'ready', color: '#fbbf24' },
            { id: 'a2', title: 'Hotel Luxo', subtitle: 'Nível A2 - Básico', icon: '🏨', desc: 'Check-in de luxo, hóspedes bilionários, sistema caído e uma equipe no limite.', status: 'ready', color: '#3b82f6' },
            { id: 'a3', title: 'Aeroporto', subtitle: 'Nível A3 - Pré-Intermediário', icon: '✈️', desc: 'Voo cancelado, bagagem perdida, turistas perdidos. Você é o agente da companhia.', status: 'soon', color: '#10b981' },
            { id: 'b1', title: 'Hospital', subtitle: 'Nível B1 - Intermediário', icon: '🏥', desc: 'Emergência médica, paciência zero e vocabulário técnico. Salve vidas em inglês.', status: 'soon', color: '#ef4444' },
            { id: 'b2', title: 'Entrevista', subtitle: 'Nível B2 - Intermediário Alto', icon: '💼', desc: 'Convença o recrutador de que você é a pessoa certa para a vaga dos sonhos.', status: 'soon', color: '#8b5cf6' },
            { id: 'vocab', title: 'Vocab de Rua', subtitle: 'Especial - Gírias', icon: '😎', desc: 'Aprenda o inglês que a escola não ensina. Gírias, expressões e phrasal verbs do dia a dia.', status: 'soon', isSpecial: true, color: '#ec4899' },
            { id: 'c1', title: 'Negociação Global', subtitle: 'Nível C1 - Avançado', icon: '🌍', desc: 'Feche um contrato milionário com uma empresa internacional sem perder a pose.', status: 'soon', color: '#06b6d4' },
            { id: 'c2', title: 'Debate na ONU', subtitle: 'Nível C2 - Fluência', icon: '🎤', desc: 'Argumente, debata e mostre domínio total do idioma em um cenário de alta pressão.', status: 'soon', color: '#f97316' },
            { id: 'survival', title: 'Sobrevivência Extrema', subtitle: 'Bônus - Caos Total', icon: '🔥', desc: 'Perdeu o passaporte, a carteira e o voo. Resolva tudo sem falar uma palavra de português.', status: 'soon', isSpecial: true, color: '#eab308' }
        ];

        const levelsContainer = document.getElementById('levels-container');

        levels.forEach(level => {
            const card = document.createElement('div');
            card.className = `level-card ${level.status === 'soon' ? 'locked' : ''}`;
            card.style.setProperty('--level-color', level.color);
            
            let badgeCls = level.status === 'ready' ? 'badge-ready' : (level.isSpecial ? 'badge-special' : 'badge-soon');
            let badgeText = level.status === 'ready' ? 'Disponível' : 'Em Breve';

            const btnText = level.status === 'ready' ? `Jogar Agora →` : `Aguardando Lançamento`;

            card.innerHTML = `
                <div class="level-header">
                    <div class="level-icon">${level.icon}</div>
                    <span class="level-badge ${badgeCls}">${badgeText}</span>
                </div>
                <span class="subtitle">${level.subtitle}</span>
                <h3>${level.title}</h3>
                <p>${level.desc}</p>
                <button class="play-btn">${btnText}</button>
            `;

            const handleClick = () => {
                if (level.status === 'ready') {
                    window.location.href = `jogo.html?l=${level.id}`;
                } else {
                    document.getElementById('modal-name').innerText = level.title;
                    document.getElementById('modal-overlay').style.display = 'flex';
                }
            };

            card.querySelector('.play-btn').addEventListener('click', handleClick);
            card.addEventListener('click', (e) => {
                if (e.target.tagName !== 'BUTTON' && e.target.tagName !== 'SPAN') handleClick();
            });

            levelsContainer.appendChild(card);
        });

        async function checkUser() {
            const { data: { session } } = await supabase.auth.getSession();
            const authArea = document.getElementById('auth-area');

            if (!session) {
                window.location.href = 'index.html';
                return;
            }

            const email = session.user.email;
            const name = session.user.user_metadata?.full_name || email.split('@')[0];
            
            const { data: profile } = await supabase.from('profiles').select('xp').eq('id', session.user.id).single();
            const userXp = profile?.xp || 0;

            authArea.innerHTML = `
                <span class="xp-badge">⭐ ${userXp} XP</span>
                <span class="user-email">Olá, ${name.split(' ')[0]}</span>
                <button class="btn-auth" id="btn-logout">Sair</button>
            `;

            document.getElementById('btn-logout').addEventListener('click', async () => {
                await supabase.auth.signOut();
                window.location.href = 'index.html';
            });
        }
        checkUser();
    </script>
</body>
</html>
